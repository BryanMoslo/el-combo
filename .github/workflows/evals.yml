name: Evals

# Runs the eval suite on demand. Each run calls the model and costs money,
# so it isn't triggered on every push. Needs the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Cases to run: smoke (cheap, no subagents), agents, or all"
        type: choice
        options: [smoke, agents, all]
        default: smoke
      runs:
        description: "Runs per case"
        default: "3"
      max_cost_usd:
        description: "Cost ceiling for the whole run (USD)"
        default: "5"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ inputs.tag }}
          RUNS: ${{ inputs.runs }}
          MAX_COST: ${{ inputs.max_cost_usd }}
        run: |
          tag_args=()
          if [ "$TAG" != "all" ]; then tag_args=(--tag "$TAG"); fi
          ~/.local/bin/claude plugin eval . \
            "${tag_args[@]}" \
            --runs "$RUNS" \
            --trust-plugin \
            --json results.json \
            --threshold 0.8 \
            --model claude-sonnet-5-5 \
            --judge-model claude-haiku-5-5 \
            --no-publish \
            --max-cost-usd "$MAX_COST"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results.json
          if-no-files-found: ignore
